# Test blueprint: assumptions below are examples, not an interpretation of every payroll policy.
project:
  name: 生活與薪資測試
  slots_per_day: 3
variables:
  stamina: { initial: 60, min: 0, max: 100, display_name: 體力 }
  money: { initial: 90, min: 0, display_name: 金錢 }
  mood: { initial: 65, min: 0, max: 100, display_name: 心情 }
  worked_shifts: { initial: 0, min: 0, integer: true, display_name: 本周完成班數 }
expressions:
  weekly_pay:
    display_name: 本期薪資
    description: 依本周完成班數結算薪資，包含全勤獎金與低出勤扣款。
    type: number
    branches:
      - when: vars.worked_shifts == 10
        value: (vars.worked_shifts * 10) + 20
        description: 完成 10 班，全勤加發獎金 20。
      - when: vars.worked_shifts >= 5 and vars.worked_shifts < 10
        value: vars.worked_shifts * 10
        description: 完成 5～9 班，按實際班數計薪。
      - when: vars.worked_shifts >= 1 and vars.worked_shifts < 5
        value: (vars.worked_shifts * 10) - 10
        description: 完成 1～4 班，扣款 10。
      - when: null
        value: "0"
        description: 未出勤，不發薪資。
task_macros:
  work:
    display_name: 工作動作
    steps:
      - { builtin: increment_variable, target: stamina, value: "-12" }
      - { builtin: increment_variable, target: worked_shifts, value: "1" }
  rest:
    display_name: 休息動作
    steps:
      - { builtin: increment_variable, target: stamina, value: "15" }
  entertain:
    display_name: 娛樂動作
    mode: sequence
    parameters: {}
    eligibility: (vars.money >= 30)
    steps:
      - builtin: increment_variable
        target: money
        value: "-30"
      - builtin: increment_variable
        target: mood
        value: "18"
  payroll:
    display_name: 結算工資
    steps:
      - { builtin: increment_variable, target: money, value: expr.weekly_pay }
      - { builtin: reset_variable, target: worked_shifts }
  mood_decay:
    display_name: 心情消耗
    steps:
      - { builtin: increment_variable, target: mood, value: "-6" }
slots:
  work:
    display_name: 工作
    branches: [ { when: null, run: { macro: work } } ]
  rest:
    display_name: 休息
    branches: [ { when: null, run: { macro: rest } } ]
  entertain:
    display_name: 娛樂
    mode: priority
    candidates:
      - macro: entertain
        arguments: {}
      - macro: rest
        arguments: {}
  payroll:
    display_name: 薪資結算
    branches: [ { when: null, run: { macro: payroll } } ]
  mood_decay:
    display_name: 每日心情消耗
    branches: [ { when: null, run: { macro: mood_decay } } ]
  doctor:
    display_name: 看醫生
  slumber:
    display_name: 沉睡
days:
  working:
    display_name: 工作日
    slots: [ work, work, rest ]
    tags: [ 工作 ]
    purposes: [ main ]
  holiday:
    display_name: 休假日
    slots: [ entertain, entertain, rest ]
    purposes: [ main ]
  payroll:
    display_name: 結算日
    start: payroll
    purposes: [ overlay ]
  daily_mood:
    display_name: 心情消耗日
    end: mood_decay
    purposes: [ overlay ]
  cold:
    display_name: 感冒日
    slots: [ doctor, slumber, slumber ]
    purposes: [ interrupt ]
weeks:
  normal:
    display_name: 正常周
    days:
      mon: working
      tue: working
      wed: working
      thu: working
      fri: working
      sat: holiday
      sun: holiday
sequences:
  life:
    weeks: [ { week: normal, repeat: null } ]
    events:
      daily_mood:
        kind: periodic
        start: { week: 1, weekday: mon }
        end: { week: 1, weekday: sun }
        every: 1
        day: daily_mood
        execution: overlay
        priority: 9
        display_name: 每日心情消耗
      payroll:
        kind: periodic
        start: { week: 1, weekday: sun }
        end: { week: 1, weekday: sun }
        # Only Sunday matches this template range; every matching date is once per week.
        every: 1
        day: payroll
        execution: overlay
        priority: 9
        display_name: 周日結算
      cold:
        kind: probability
        start: { week: 1, weekday: mon }
        end: { week: 1, weekday: sun }
        probability: 4
        cooldown_days: 7
        day: cold
        execution: interrupt_main
        priority: 1
        display_name: 感冒
    display_name: 單周無限循環生活
builtins:
  increment_variable: {}
  reset_variable: {}
